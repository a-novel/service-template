services:
  # ====================================================================================================================
  # DATABASE
  # ====================================================================================================================

  postgres-template:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - api
    environment:
      # Inline test-default credentials. The daemon owns dynamic env (ports,
      # derived URLs, cross-service refs); constants like these belong to the
      # service's compose. Mirrors what every service's CI workflow hardcodes.
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - template-postgres-data:/var/lib/postgresql/

  # ====================================================================================================================
  # ONE-SHOT TARGETS (run on infra-up, exit when done)
  # ====================================================================================================================

  # migrations: applies the schema. Idempotent — safe to re-run every
  # infra-up. No healthcheck — its absence is what marks a compose service as
  # a one-shot rather than a long-runner.
  service-template-migrations:
    profiles: ["migrations"]
    build:
      context: ..
      dockerfile: ./builds/migrations.Dockerfile
    depends_on:
      postgres-template:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-template:5432/postgres?sslmode=disable
    networks:
      - api

  # ====================================================================================================================
  # LONG-RUNNER TARGETS (rest, grpc)
  # ====================================================================================================================

  # Profiled so a plain `podman compose up` does not start it: `a-novel run`
  # brings this file up only for the postgres dependency (+ the migrations
  # one-shot) and runs this entrypoint locally (go run); a containerised
  # copy on the same host ${GRPC_PORT} would collide ("bind: address
  # already in use"). `--profile grpc` opts into the dockerised copy.
  service-template-grpc:
    profiles: ["grpc"]
    build:
      context: ..
      dockerfile: ./builds/standalone.grpc.Dockerfile
    ports:
      - "${GRPC_PORT}:8080"
    depends_on:
      postgres-template:
        condition: service_healthy
      service-template-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-template:5432/postgres?sslmode=disable
    networks:
      - api

  # Same rationale as grpc above; profiled out of the default `up` so the
  # locally-run REST entrypoint owns ${REST_PORT}. `--profile rest` opts
  # into the dockerised copy.
  service-template-rest:
    profiles: ["rest"]
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      postgres-template:
        condition: service_healthy
      service-template-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-template:5432/postgres?sslmode=disable
    networks:
      - api

networks:
  api:

volumes:
  template-postgres-data:
