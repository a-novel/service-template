services:
  postgres-template:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - api
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - template-postgres-data:/var/lib/postgresql/

  # Profiled so a plain `podman compose up` does NOT start it: `a-novel run`
  # brings this file up only for the postgres dependency and runs THIS
  # entrypoint locally (go run); a containerised copy on the same host
  # ${GRPC_PORT} would collide ("bind: address already in use").
  # `--profile grpc` opts into the dockerised copy instead.
  service-template-grpc:
    profiles: ["grpc"]
    build:
      context: ..
      dockerfile: ./builds/standalone.grpc.Dockerfile
    ports:
      - "${GRPC_PORT}:8080"
    depends_on:
      - postgres-template
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-template:5432/template?sslmode=disable
    networks:
      - api

  # Same rationale as grpc above; profiled out of the default `up` so the
  # locally-run REST entrypoint owns ${REST_PORT}. `--profile rest` opts
  # into the dockerised copy.
  service-template-rest:
    profiles: ["rest"]
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      - postgres-template
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-template:5432/template?sslmode=disable
    networks:
      - api

networks:
  api:

volumes:
  template-postgres-data:
