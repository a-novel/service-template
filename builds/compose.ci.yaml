services:
  postgres:
    image: "${DATABASE_IMAGE:-service-template-database:ci}"
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

  standalone-grpc:
    profiles: ["grpc"]
    image: "${STANDALONE_GRPC_IMAGE:-service-template-standalone-grpc:ci}"
    build:
      context: ..
      dockerfile: ./builds/standalone.grpc.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable

  standalone-rest:
    profiles: ["rest"]
    image: "${STANDALONE_REST_IMAGE:-service-template-standalone-rest:ci}"
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
