# Managed by `a-novel repo update` — edit the template in stack, not this copy.
#
# Deletes this repository's container images that nothing deploys once they are a week old: untagged
# builds, closed pull request tags, and branch or merge-queue tags. Release tags, master, open pull
# request tags and every master build stay. A deleted version can be restored for 30 days.
name: clean images

on:
  pull_request:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: false

permissions: {}

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: List this repository's container packages
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names=$(gh api --paginate "orgs/$GITHUB_REPOSITORY_OWNER/packages?package_type=container" \
            --jq '[.[] | select(.repository.full_name == env.GITHUB_REPOSITORY) | .name]' | jq -sc 'add // []')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  clean:
    needs: [packages]
    if: needs.packages.outputs.names != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.names) }}
    # The cleanup is not safe to run twice at once on one package.
    concurrency:
      group: clean-images-${{ matrix.package }}
      cancel-in-progress: false
    permissions:
      packages: write
      pull-requests: read
    steps:
      - uses: a-novel-kit/workflows/build-actions/clean-images@eeca20d143f0592af8ebf178a817ef3251749862
        with:
          package: ${{ matrix.package }}
          github_token: ${{ github.token }}
          dry_run: "true"
