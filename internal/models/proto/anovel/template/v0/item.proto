syntax = "proto3";

package anovel.template.v0;

import "google/protobuf/timestamp.proto";

// An Item is the placeholder resource the template exposes through its item RPCs.
message Item {
  // Unique identifier, formatted as a UUID.
  string id = 1;
  // Name of the item.
  string name = 2;
  // Description of the item, empty when it has none.
  string description = 3;
  // CreatedAt is when the item was created.
  google.protobuf.Timestamp created_at = 4;
  // UpdatedAt is when the item last changed.
  google.protobuf.Timestamp updated_at = 5;
}
