syntax = "proto3";

package anovel.template.v0;

import "anovel/template/v0/item.proto";

// ItemListService returns a page of items.
service ItemListService {
  // Returns a page of items, newest first, with their total. Returns INVALID_ARGUMENT for a limit
  // below 0 or above 100, or a negative offset.
  rpc ItemList(ItemListRequest) returns (ItemListResponse);
}

// ItemListRequest bounds the page of items to return.
message ItemListRequest {
  reserved 2, 3;
  reserved "after";

  // Maximum number of items to return, from 1 to 100. Zero selects 20.
  int32 limit = 1;
  // How many items, newest first, come before the page. Zero starts at the newest item.
  int32 offset = 4;
}

// ItemListResponse returns the requested page of items, empty past the end.
message ItemListResponse {
  // The items of the page.
  repeated Item items = 1;
  // How many items exist in all, so a client paging through them knows when it holds them all. A
  // page past the end reports 0.
  int64 total = 2;
}
